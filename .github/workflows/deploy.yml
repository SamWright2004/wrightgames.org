name: Deploy portfolio

on:
  push:
    branches:
      - codex/portfolio-redesign
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Astro site
        uses: withastro/action@v6
        with:
          node-version: 24

      - name: Verify content and built output before publishing
        run: npm run check && npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
